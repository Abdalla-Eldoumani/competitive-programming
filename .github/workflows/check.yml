name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build_index.py reads the full history to date each problem.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check problem layout
        run: python tools/check_repo.py
      - name: Check the index is up to date
        run: python tools/build_index.py --check

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # LeetCode solutions are class bodies that only build against the site's
      # own harness, so only the two stdin/stdout platforms are compiled here.
      #
      # Solutions are syntax-checked, which is proportionate for 320 files of
      # plain code. Templates get a real -c compile: pragma failures surface
      # during inlining, and -fsyntax-only does not run that pass, so a template
      # that cannot possibly build on the judge would otherwise pass here.
      - name: Compile every standalone solution
        run: |
          fail=0
          run() {
            src="$1"; shift
            "$@" "$src" 2>/tmp/err || {
              echo "::error file=$src::does not compile"
              sed 's/^/    /' /tmp/err
              fail=1
            }
          }
          while IFS= read -r src; do run "$src" g++ -std=c++17 -fsyntax-only; done \
            < <(find CodeForces HackerRank -name '*.cpp')
          while IFS= read -r src; do run "$src" gcc -std=c11 -fsyntax-only; done \
            < <(find CodeForces HackerRank -name '*.c')
          while IFS= read -r src; do run "$src" g++ -std=c++17 -O2 -c -o /dev/null; done \
            < <(find templates -name '*.cpp')
          exit $fail
